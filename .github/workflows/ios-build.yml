name: Build iOS IPA (Sideloadly)

on:
  push:
    branches: [ main, master ]
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  pull_request:
    paths:
      - "ios/**"
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios/LidupScanner
        run: xcodegen generate

      - name: Build unsigned Release app
        working-directory: ios/LidupScanner
        run: |
          xcodebuild \
            -project LidupScanner.xcodeproj \
            -scheme LidupScanner \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA for Sideloadly
        working-directory: ios/LidupScanner
        run: |
          rm -rf Payload LidupScanner.ipa
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/LidupScanner.app Payload/
          zip -r -q LidupScanner.ipa Payload

      - name: Upload LidupScanner.ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: LidupScanner-ipa
          path: ios/LidupScanner/LidupScanner.ipa
          if-no-files-found: error
