[package]
name = "lidup_core"
version = "0.1.0"
edition = "2021"
description = "Shared Rust high-performance geometry & depth kernel for LidUp (PC Py/ctypes + iOS ARM64 staticlib)"

[lib]
name = "lidup_core"
crate-type = ["cdylib", "staticlib"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
