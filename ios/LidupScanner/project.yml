name: LidupScanner
options:
  bundleIdPrefix: com.lidup
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"

targets:
  LidupScanner:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
    settings:
      base:
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        PRODUCT_BUNDLE_IDENTIFIER: com.lidup.scanner
        PRODUCT_NAME: LidupScanner
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    scheme:
      testTargets: []
